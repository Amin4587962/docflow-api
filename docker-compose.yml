services:
  api:
    build: .
    container_name: docflow-api
    ports:
      - "8000:80"
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: docflow-postgres
    environment:
      POSTGRES_USER: docflow_user
      POSTGRES_PASSWORD: docflow_password
      POSTGRES_DB: docflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow_user -d docflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
